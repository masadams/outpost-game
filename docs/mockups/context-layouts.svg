<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="530" viewBox="0 0 1440 530" role="img" aria-labelledby="title desc"><title id="title">Outpost contextual interface layout references</title><desc id="desc">Flight has a clear play area. Construction and combat use one right operations panel. Telemetry remains along the bottom.</desc><style>text{font-family:monospace;font-size:12px;fill:#c5dbe4}.title{font-size:19px;fill:#8ce9dd}.muted{fill:#9bb4c5;font-size:10px}.panel{fill:#102535;stroke:#304b5d}.clear{fill:none;stroke:#8ce9dd;stroke-dasharray:5 6;opacity:.45}</style><rect width="1440" height="530" fill="#06101a"/><g transform="translate(18,24)"><text class="title" x="0" y="20">FLIGHT</text><text class="muted" x="0" y="42">Panels closed until needed</text><rect class="panel" x="0" y="62" width="450" height="400" rx="2"/><rect x="1" y="63" width="448" height="398" fill="#0a1726"/><text x="14" y="88">OUTPOST</text><text class="muted" x="14" y="108">Cargo · Colony · Combat · Defence</text><text class="muted" x="305" y="88">Sound / Help</text><rect class="clear" x="175" y="147" width="90" height="177"/><text class="muted" x="180" y="235">PLAY AREA</text><path d="M1 358 Q220 240 449 358" stroke="#385563" fill="#18323c"/><path d="M218 266 l7 -14 l7 14 l-7 -4 z" fill="#8ce9dd"/><rect class="panel" x="14" y="376" width="348" height="50"/><text class="muted" x="23" y="393">ALT / RADIAL / DRIFT / FUEL / HULL</text><text x="23" y="414">Telemetry always available</text><text class="muted" x="14" y="447">Contextual controls · Weapon state</text><circle class="panel" cx="408" cy="402" r="25"/><text class="muted" x="300" y="150">No permanent</text><text class="muted" x="300" y="167">side panels</text></g><g transform="translate(492,24)"><text class="title" x="0" y="20">CONSTRUCTION</text><text class="muted" x="0" y="42">Blueprints / placement / inventory</text><rect class="panel" x="0" y="62" width="450" height="400" rx="2"/><rect x="1" y="63" width="448" height="398" f